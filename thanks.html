<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060914">
<title>プロプランへようこそ｜Motif</title>
<link rel="icon" href="assets/motif-mark.svg" type="image/svg+xml">
<!-- Where Stripe sends people back: ?from=app (paid, Checkout success), ?from=portal (Customer Portal return),
     ?from=cancel (left Checkout without paying). URLs set in MVP Repo/apps/backend/src/billing/router.ts. -->
<style>
  :root { color-scheme: dark; --bg: #060914; --ink: #fff; --dim: #ffffffa8; --faint: #ffffff6b; --line: #ffffff14;
    --blue: #6699eb; --cyan: #96d7d9; --peach: #efb486; --io: cubic-bezier(.65, 0, .35, 1); --out: cubic-bezier(.16, 1, .3, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); overflow-x: clip;
    font: 15px/1.85 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    font-feature-settings: "palt"; letter-spacing: .02em; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* light: the LP's spectrum colours as three slow, very soft washes rising from below */
  .aura { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .aura i { position: absolute; bottom: -38vh; width: 70vw; height: 70vh; border-radius: 50%; filter: blur(90px); opacity: .55; animation: breathe 10s ease-in-out infinite alternate; }
  .aura i:nth-child(1) { left: -12vw; background: #075c96; }
  .aura i:nth-child(2) { left: 18vw; background: #39aecb; opacity: .3; animation-delay: -3s; }
  .aura i:nth-child(3) { right: -22vw; background: #f39174; opacity: .2; animation-delay: -6s; }
  .aura::after { content: ""; position: absolute; inset: 0; background: radial-gradient(1000px 520px at 50% 34%, #060914 30%, #06091400 100%); }
  @keyframes breathe { from { transform: translateY(0) scale(1); } to { transform: translateY(-5vh) scale(1.08); } }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(20px, 2.7vw, 48px); border-bottom: 1px solid #ffffff0b; }
  .wordmark { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 600 22px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -.02em; }
  .wordmark img { width: 30px; height: 30px; }
  header nav a { font-size: 13px; color: var(--dim); text-decoration: none; transition: color .2s; }
  header nav a:hover { color: #fff; }

  main { flex: 1; display: grid; place-items: center; padding: 88px 20px 112px; }
  .panel { width: min(560px, 100%); text-align: center; }

  /* (unused) the mark: a ring that closes, then the check (or the arrow) draws in */
  .badge { position: relative; width: 84px; height: 84px; margin: 0 auto 30px; }
  .badge::before { content: ""; position: absolute; inset: -18px; border-radius: 50%; background: radial-gradient(circle, #96d7d933, transparent 68%);
    opacity: 0; animation: glow 1.2s .9s var(--out) forwards; }
  .badge svg { position: relative; width: 100%; height: 100%; overflow: visible; }
  .badge .ring { fill: none; stroke: url(#g); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 245; stroke-dashoffset: 245; transform: rotate(-90deg); transform-origin: 50% 50%;
    animation: draw 1.1s .15s var(--io) forwards; }
  .badge .disc { fill: #ffffff08; }
  .badge .mark { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: draw .55s 1s var(--out) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow { to { opacity: 1; } }

  .rise { opacity: 0; transform: translateY(14px); animation: rise .9s var(--out) forwards; animation-delay: calc(.55s + var(--d, 0) * .1s); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .eyebrow { display: block; margin-bottom: 16px; font-size: 11.5px; font-weight: 600; letter-spacing: .2em; color: var(--cyan); }
  h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.35; font-weight: 600; letter-spacing: .02em; text-wrap: balance; }
  .lead { margin: 20px auto 0; max-width: 30em; line-height: 1.95; color: var(--dim); font-size: 15px; text-wrap: pretty; }

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 40px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 28px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none;
    transition: transform .2s var(--out), background-color .2s, border-color .2s, box-shadow .3s; }
  .btn svg { width: 16px; height: 16px; transition: transform .25s var(--out); }
  .btn-primary { background: #f3f5f8; color: #0a0d16; box-shadow: 0 10px 30px -10px #96d7d966; }
  .btn-primary:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 14px 36px -10px #96d7d999; }
  .btn-primary:hover svg { transform: translateX(3px); }
  .btn-ghost { border: 1px solid #ffffff2a; color: #fff; background: #ffffff06; }
  .btn-ghost:hover { border-color: #ffffff55; background: #ffffff0d; }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .hint { margin: 16px 0 0; font-size: 12.5px; color: var(--faint); }

  /* the details, in a glass card with the plan card's colour hairline */
  .card { position: relative; margin-top: 64px; padding: 4px 28px; border-radius: 18px; text-align: left; background: linear-gradient(180deg, #ffffff0a, #ffffff04);
    border: 1px solid #ffffff12; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 #ffffff0d; }
  .card::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 1px; background: linear-gradient(90deg, transparent, var(--blue), var(--cyan), var(--peach), transparent); opacity: .8; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: grid; grid-template-columns: 9.5em 1fr; gap: 20px; align-items: baseline; padding: 20px 0; font-size: 13.5px; line-height: 1.7; border-bottom: 1px solid var(--line); }
  .rows li:last-child { border-bottom: 0; }
  .rows li > :first-child { color: var(--faint); }
  .rows li > :last-child { color: #ffffffd9; }
  .rows a { text-decoration: none; border-bottom: 1px solid #96d7d980; }
  .rows a:hover { border-color: var(--cyan); }
  .rows li > a { justify-self: start; }
  .unlock { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; }
  .unlock span { padding: 2px 10px; border-radius: 999px; background: #96d7d914; border: 1px solid #96d7d933; color: #dff6f7; font-size: 12.5px; }

  footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; padding: 24px 20px 30px; border-top: 1px solid #ffffff0b; font-size: 12px; color: var(--faint); }
  footer a { text-decoration: none; transition: color .2s; }
  footer a:hover { color: #fff; }

  [hidden] { display: none !important; }
  @media (max-width: 560px) {
    main { padding: 48px 20px 64px; }
    .rows li { grid-template-columns: 1fr; gap: 2px; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: 1ms !important; animation-delay: 0s !important; }
    .aura i { animation: none; }
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <a class="wordmark" href="./"><img src="assets/motif-mark.svg" alt="" width="30" height="30">Motif</a>
  <nav><a href="mailto:support@motif-ai.app">お問い合わせ</a></nav>
</header>

<main>
  <div class="panel">

    <h1 class="rise" id="title" style="--d:1">プロプランへようこそ</h1>
    <p class="lead rise" id="lead" style="--d:2">お支払いが完了しました。<br>Motif に戻ると、すぐにすべての機能をお使いいただけます。</p>

    <div class="actions rise" style="--d:3">
      <a class="btn btn-primary" href="motif://open">Motif に戻る<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></a>
      <a class="btn btn-ghost" id="second" href="refund.html" hidden>返金ポリシー</a>
    </div>
    <p class="hint rise" style="--d:3">開かない場合は、このページを閉じて Motif のウィンドウに戻ってください。</p>

    <div class="card rise" style="--d:5">
      <ul class="rows">
        <li id="row-receipt"><span>領収書</span><span>お支払いに使ったメールアドレスへお送りしました</span></li>
        <li id="row-plan"><span>プランの確認・解約</span><span>Motif の 設定 › プラン › プランを管理</span></li>
        <li><span>お問い合わせ</span><a href="mailto:support@motif-ai.app">support@motif-ai.app</a></li>
      </ul>
    </div>
  </div>
</main>

<footer>
  <a href="terms.html">利用規約</a><a href="privacy.html">プライバシーポリシー</a><a href="tokushoho.html">特定商取引法に基づく表記</a><a href="refund.html">返金ポリシー</a><span>© 2026 Motif</span>
</footer>

<script>
  const from = new URLSearchParams(location.search).get("from");
  const $ = (id) => document.getElementById(id);
  const set = (id, text) => { $(id).textContent = text; };
  if (from === "portal") {
    document.title = "お手続きが完了しました｜Motif";
    set("title", "お手続きが完了しました");
    set("lead", "変更した内容は、Motif にすぐ反映されます。");
    $("row-receipt").hidden = true;
  } else if (from === "cancel") {
    // left Checkout without paying: nothing is wrong, so no ×; an arrow back to the app instead
    document.title = "お支払いは完了していません｜Motif";
    set("title", "お支払いは完了していません");
    set("lead", "料金は発生していません。プロジェクトはそのまま残っています。Motif に戻れば、いつでもプロプランにアップグレードできます。");
    $("row-receipt").hidden = true;
    $("row-plan").innerHTML = "<span>プロプラン</span><span>月額 ¥5,500（税込）· いつでも解約できます</span>";
    $("second").hidden = false;
  }
</script>
</body>
</html>
