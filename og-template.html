<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#0e100e;color:#f4f5f0;font-family:"Geist","Noto Sans JP",sans-serif;font-feature-settings:"palt" 1;position:relative;overflow:hidden}
.glow{position:absolute;left:-10%;top:-40%;width:70%;height:120%;background:radial-gradient(closest-side,rgba(201,245,98,.16),transparent)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.mark{display:flex;align-items:center;gap:12px;font-family:Geist,sans-serif;font-weight:700;font-size:28px}
.mark .dot{width:14px;height:14px;border-radius:50%;background:#c9f562;box-shadow:0 0 0 5px rgba(201,245,98,.25)}
.mark .ja{font-family:"Noto Sans JP";font-weight:500;font-size:18px;color:#a6ab9f;margin-left:4px}
h1{margin:0;font-size:62px;line-height:1.3;letter-spacing:-.035em;font-weight:700}
p{margin:18px 0 0;font-size:24px;color:#a6ab9f;line-height:1.6}
.tags{display:flex;gap:10px}
.tag{border:1px solid #2b302a;border-radius:999px;padding:8px 18px;font-size:18px;color:#c9f562;font-weight:500}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="mark"><span class="dot"></span>Motif AI<span class="ja">モティフAI</span></div>
<div><h1>いつもの編集を、<br>Premiere Pro が覚えている</h1><p>一度組み立てた編集を、次の素材に同じ手つきで</p></div>
<div class="tags"><span class="tag">Premiere Pro パネル</span><span class="tag">Claude Desktop 連携</span><span class="tag">macOS</span><span class="tag">早期アクセス</span></div>
</div></body></html>
